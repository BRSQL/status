# Sonda da status page no GitHub Actions — SEGUNDA OPINIÃO.
#
# A sonda principal é scripts/feeder.py (VM no Brasil, a cada 30 s). Esta
# cobre a VM fora do ar: o cron hospedado é best-effort (na prática roda a
# cada 3–5 h) e o GitHub o desativa após 60 dias sem atividade no repo —
# reative com `gh workflow enable probe -R BRSQL/status`.
#
# Edita o status.json só quando o estado observado muda (componente +
# incidente automático). Sem mudança, sem commit. 403 visto do runner
# estrangeiro é INCONCLUSIVO (a WAF pode barrá-lo): não abre nem fecha nada e
# vira um aviso no run. Fiscal/SEFAZ e Pagamentos são manuais ("manual": true)
# e nunca são tocados; incidente escrito à mão também não.
name: probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sondar e atualizar status.json
        id: sonda
        run: |
          set +e
          python3 scripts/probe.py
          rc=$?
          set -e
          if [ "$rc" = "78" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != "0" ]; then
            exit "$rc"
          fi
      - name: Commit da mudança de estado
        if: steps.sonda.outputs.changed == 'true'
        run: |
          git config user.name "yvera-status-probe"
          git config user.email "suporte@brsql.com.br"
          git add status.json
          git commit -m "probe: mudança de estado detectada pela sonda externa"
          # Corrida com um commit manual no meio do run: rebase e tenta de
          # novo uma vez. A segunda falha precisa deixar o workflow vermelho;
          # escondê-la faria a página continuar velha com a sonda "verde".
          if ! git push; then
            git pull --rebase
            git push
          fi
